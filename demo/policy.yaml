name: ec_golden_image_policy
description: Validates SBOM image registries and the SLSA provenance builder
sources:
  - name: demo-policy
    data:
      - ./data
    policy:
      - ./policy/lib
      - ./policy/approved_image_registries
      - ./policy/approved_slsa_builder
    config:
      include:
        - "approved_image_registries.approved_image_registries"
        - "approved_image_registries.spdx_sbom_found"
        - "approved_slsa_builder.slsa_provenance_found"
        - "approved_slsa_builder.slsa_builder_id_found"
        - "approved_slsa_builder.slsa_builder_id_accepted"
